# Temporal: averiguar por qué publicar la versión de Acta devuelve 403.
# Se borra en cuanto se sepa.
name: Probar publicación

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTA: 7b2f0484703771f8c852d841a3089047c5a3e044
        run: |
          echo hola > prueba.txt

          echo "== 1) con --target al commit de Acta =="
          gh release delete prueba-acta --yes --cleanup-tag 2>/dev/null || true
          if gh release create prueba-acta prueba.txt --title t --notes n --target "$ACTA"; then
            echo "OK con --target al commit"
          else
            echo "FALLA con --target al commit"
          fi

          echo "== 2) sin --target =="
          gh release delete prueba-acta --yes --cleanup-tag 2>/dev/null || true
          if gh release create prueba-acta prueba.txt --title t --notes n; then
            echo "OK sin --target"
          else
            echo "FALLA sin --target"
          fi

          echo "== 3) con --target a la rama =="
          gh release delete prueba-acta --yes --cleanup-tag 2>/dev/null || true
          if gh release create prueba-acta prueba.txt --title t --notes n --target "${{ github.sha }}"; then
            echo "OK con --target a la rama"
          else
            echo "FALLA con --target a la rama"
          fi

          gh release delete prueba-acta --yes --cleanup-tag 2>/dev/null || true

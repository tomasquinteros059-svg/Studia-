# Construye un APK instalable sin depender de los servidores de Expo.
#
# El contenedor donde se desarrolla no puede salir a expo.dev, así que no hay
# EAS ni Expo Go. Acá el APK se arma con el SDK de Android que ya trae el
# runner: `expo prebuild` genera el proyecto nativo y Gradle lo compila. No
# hace falta cuenta de Expo, ni token, ni ningún secreto.
#
# Cómo usarlo: pestaña Actions → "APK para probar" → Run workflow. Al terminar,
# el APK queda colgado del run, en Artifacts.

name: APK para probar

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

# Para poder publicar la versión con el APK colgado.
permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    # Contra qué servidor se compila.
    #
    # `expo export` y `assembleRelease` empaquetan el JavaScript, y ahí es donde
    # estas dos variables quedan dentro del APK. Si no están, `lib/config.ts`
    # pone la app en modo demostración: datos de ejemplo en el teléfono, sin
    # cuentas y sin nada que se guarde en ninguna parte.
    #
    # Van al nivel del trabajo y no de un paso porque hacen falta en los cinco
    # que empaquetan: la auditoría del paquete y las tres compilaciones.
    #
    # Se cargan en Settings → Secrets and variables → Actions:
    #   SUPABASE_URL        https://xxxxxxxx.supabase.co
    #   SUPABASE_ANON_KEY   la clave anónima del proyecto
    # La anónima es pública por diseño —va dentro del APK, que cualquiera puede
    # abrir—; lo que protege los datos son las políticas de acceso de la base.
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      # La clave con que se sube a Google Play. Va acá arriba y no en el paso
      # porque `secrets` no se puede mirar desde un `if:` y `env` sí, y el
      # .aab solo tiene sentido armarlo cuando la clave está.
      #   ANDROID_KEYSTORE_BASE64    el archivo .jks en base64
      #   ANDROID_KEYSTORE_PASSWORD  la clave del archivo
      #   ANDROID_KEY_ALIAS          el alias de la clave de adentro
      #   ANDROID_KEY_PASSWORD       la clave de esa clave
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

    steps:
      # Con la profundidad de siempre —un solo commit— `git rev-list --count`
      # devolvería 1, y numerar la compilación con 1 la dejaría por debajo de
      # la que ya está instalada: Android rechazaría la actualización.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json

      # React Native pide JDK 17.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar dependencias
        run: npm ci --prefix app

      # Que un APK roto no llegue nunca a la tablet.
      - name: Pruebas
        run: |
          npm run prueba
          npm run prueba:ui
          npm run tipos
          # Que los textos legales del repositorio y el listado de licencias no
          # queden atrás del código: una dependencia agregada sin regenerar el
          # listado deja el APK incumpliendo una licencia sin que nada avise.
          npm run prueba:legales
          npm run prueba:licencias
          # Que las funciones del servidor sean TypeScript válido, y que los
          # dos archivos generados —las migraciones juntas y las funciones
          # pegables— no hayan quedado atrás de lo que sí se editó. Son los
          # que se copian a mano en el panel de Supabase: si quedan viejos,
          # el servidor y el APK dejan de ser la misma versión y nada avisa.
          npm run prueba:sintaxis
          # Que ningún dato de ejemplo pueda llegar a un colegio de verdad.
          npm run prueba:sin-ejemplos
          npm run prueba:migraciones-juntas
          npm run prueba:funciones-juntas

      # Que el APK traiga de verdad lo que dice traer.
      #
      # Las pruebas de arriba comprueban que el código funcione; esto comprueba
      # que el código haya entrado al paquete. No es lo mismo, y la diferencia
      # se notó: hubo APK «arregladas» que llegaron sin el arreglo y no había
      # cómo saberlo sin instalarlas.
      - name: Comprobar que el paquete trae todas las funciones
        run: npm run prueba:paquete-android

      - name: Generar el proyecto Android
        working-directory: app
        run: npx expo prebuild --platform android --no-install
        env:
          EXPO_NO_TELEMETRY: "1"

      # El proyecto nativo se regenera acá en cada compilación, y sale firmando
      # el release con el keystore de depuración. Para la tablet da lo mismo;
      # Google Play lo rechaza. Esto deja la firma condicionada a que exista la
      # clave de subida, y se cae si la plantilla de Expo cambió de forma —que
      # es la manera en que esto se rompería sin que nadie lo note—.
      - name: Preparar la firma de subida
        run: node herramientas/firmar-android.mjs app/android/app/build.gradle

      # `assembleRelease` empaqueta el JavaScript adentro del APK. Un build de
      # depuración no sirve: esperaría un servidor de desarrollo en la red y
      # fallaría al abrirlo, que es exactamente lo que hay que evitar.
      # Se compila dos veces a propósito. Por omisión el APK trae las cuatro
      # arquitecturas de Android en el mismo archivo, y las bibliotecas
      # nativas se llevan ahí la mayor parte de los 84 MB: un aparato usa una
      # sola y carga las otras tres de puro peso muerto. El primero trae solo
      # arm64, que es lo que usa cualquier tablet o teléfono de los últimos
      # años. El segundo las trae todas y queda como red de seguridad para un
      # aparato viejo o un Chromebook con procesador Intel.
      # Entre una compilación y otra hay que dejar el proyecto limpio, y
      # `gradlew clean` no sirve para eso: su tarea de C++ borra el código
      # generado de las dependencias y deja la caché de CMake apuntando a
      # carpetas que ya no existen. La segunda vez que se ejecuta revienta con
      # "add_subdirectory given source ... which is not an existing directory".
      # Borrar las carpetas a mano no tiene ese problema: no queda ninguna
      # caché que pueda quedar desincronizada.
      - name: Preparar el limpiador entre compilaciones
        working-directory: app/android
        run: |
          cat > limpiar.sh <<'FIN'
          #!/usr/bin/env bash
          set -euo pipefail
          rm -rf app/build app/.cxx build
          find ../node_modules -maxdepth 4 -type d -name .cxx -exec rm -rf {} + 2>/dev/null || true
          FIN
          chmod +x limpiar.sh

      # El nombre del archivo lleva la versión y el commit. Con un nombre fijo,
      # el teléfono guarda el nuevo como "StudIA(1).apk" y deja el viejo primero
      # en la lista de Descargas: tocar el equivocado instala la versión
      # anterior y nada avisa de nada. Con esto, los dos archivos se distinguen
      # de un vistazo y ninguna caché puede servir uno por otro.
      # Android solo instala un APK encima de otro si el `versionCode` subió.
      # Mantenerlo a mano es cuestión de tiempo hasta que alguien lo olvide y
      # la actualización quede rechazada con un "no se pudo instalar" que no
      # explica nada. Sale de la cantidad de commits: sube solo, y sube igual
      # aunque se compile dos veces el mismo día.
      #
      # La firma no hace falta cuidarla: el keystore de depuración que trae la
      # plantilla de Expo es siempre el mismo archivo, así que dos APK armados
      # acá quedan firmados igual y uno se pone encima del otro.
      - name: Numerar la compilación
        id: nombre
        run: |
          version=$(node -p "require('./app/app.json').expo.version")
          codigo=$(git rev-list --count HEAD)

          # Si el historial llegara recortado, la cuenta saldría en 1 o 2 y el
          # APK no se podría instalar encima del que ya está. Vale más que la
          # compilación se detenga acá, donde se ve el motivo, que entregar un
          # archivo que el teléfono rechaza sin decir por qué.
          if [ "$codigo" -lt 10 ]; then
            echo "::error::La cuenta de commits salió en $codigo. El historial llegó incompleto."
            exit 1
          fi

          # Va en tres lugares y no es duplicación: `android.versionCode` es lo
          # que Android mira para dejar instalar encima, `ios.buildNumber` es
          # lo mismo para la App Store —que rechaza una subida cuyo número no
          # sea mayor que el anterior— y `extra.compilacion` es lo que la app
          # puede leer para mostrarlo, porque los bloques `android` e `ios` no
          # llegan a la configuración en todas las plataformas.
          #
          # iOS se numera acá aunque este flujo no lo compile: el día que
          # alguien lo compile desde un Mac, lo va a hacer con este app.json, y
          # descubrir el número en el momento del rechazo es tarde.
          node -e '
            const fs = require("fs");
            const ruta = "app/app.json";
            const c = JSON.parse(fs.readFileSync(ruta, "utf8"));
            const codigo = Number(process.argv[1]);
            c.expo.android.versionCode = codigo;
            c.expo.ios = { ...c.expo.ios, buildNumber: String(codigo) };
            c.expo.extra = { ...c.expo.extra, compilacion: codigo };
            fs.writeFileSync(ruta, JSON.stringify(c, null, 2) + "\n");
          ' "$codigo"
          # Un APK sin servidor y uno conectado se ven igual por fuera y hacen
          # cosas distintas: en el primero nada de lo que hagas se guarda. Que
          # se distingan por el nombre del archivo, antes de instalarlo.
          if [ -n "${EXPO_PUBLIC_SUPABASE_URL}" ] && [ -n "${EXPO_PUBLIC_SUPABASE_ANON_KEY}" ]; then
            modo="conectada"
            marca=""
          else
            modo="demostración"
            marca="-demo"
            echo "::warning::Sin SUPABASE_URL ni SUPABASE_ANON_KEY: el APK sale en modo demostración."
          fi

          echo "Versión $version · compilación $codigo · $modo"
          echo "modo=$modo" >> "$GITHUB_OUTPUT"
          echo "sufijo=$version-$codigo-${GITHUB_SHA::7}$marca" >> "$GITHUB_OUTPUT"

      - name: Compilar el APK para arm64
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a
          mkdir -p ../../entrega
          cp app/build/outputs/apk/release/*.apk "../../entrega/StudIA-${{ steps.nombre.outputs.sufijo }}.apk"

      # Con R8: encoge el código Java, que es el segundo bulto del paquete
      # después de las bibliotecas nativas. Va aparte y no reemplaza al de
      # arriba porque R8 rompe código que usa reflexión, y desde el entorno de
      # desarrollo no hay forma de abrir el APK resultante para comprobarlo.
      # Si este falla al arrancar, el de arriba sigue estando.
      - name: Compilar el APK liviano
        working-directory: app/android
        run: |
          ./limpiar.sh
          ./gradlew assembleRelease --no-daemon \
            -PreactNativeArchitectures=arm64-v8a \
            -Pandroid.enableMinifyInReleaseBuilds=true \
            -Pandroid.enableShrinkResourcesInReleaseBuilds=true
          cp app/build/outputs/apk/release/*.apk "../../entrega/StudIA-liviano-${{ steps.nombre.outputs.sufijo }}.apk"

      - name: Compilar el APK universal
        working-directory: app/android
        run: |
          ./limpiar.sh
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/*.apk "../../entrega/StudIA-universal-${{ steps.nombre.outputs.sufijo }}.apk"

      # ── Google Play ─────────────────────────────────────────────────────
      #
      # Va después de los APK a propósito. Las propiedades de la firma se
      # escriben recién acá, así que los tres APK de arriba salen con la clave
      # de depuración: esa es la que permite instalarlos encima del que ya está
      # en la tablet sin desinstalar nada. Si salieran firmados con la de
      # subida, cada actualización obligaría a desinstalar primero.
      #
      # Play no acepta APK para una aplicación nueva: pide un .aab.
      - name: Armar el .aab para Google Play
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        working-directory: app/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./limpiar.sh
          # El archivo queda junto a build.gradle: `storeFile file(...)` resuelve
          # desde ahí.
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > app/subida.keystore
          # Por gradle.properties y no por -P: así las claves no quedan escritas
          # en la línea de comando, que se ve entera en el registro.
          {
            echo "STUDIA_KEYSTORE=subida.keystore"
            echo "STUDIA_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
            echo "STUDIA_KEY_ALIAS=$ANDROID_KEY_ALIAS"
            echo "STUDIA_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
          } >> gradle.properties
          ./gradlew bundleRelease --no-daemon
          cp app/build/outputs/bundle/release/*.aab \
            "../../entrega/StudIA-${{ steps.nombre.outputs.sufijo }}.aab"

      # Un .aab firmado con la clave equivocada se ve igual que uno bueno, y el
      # error aparece recién al subirlo, con un mensaje que no dice que el
      # problema sea la firma.
      - name: Comprobar con qué clave quedó firmado
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          firma=$(keytool -printcert -jarfile entrega/*.aab 2>/dev/null | grep -m1 "Propietario\|Owner")
          echo "$firma"
          if echo "$firma" | grep -qi "Android Debug"; then
            echo "::error::El .aab salió firmado con la clave de depuración. Play lo rechazaría."
            exit 1
          fi
          if [ -z "$firma" ]; then
            echo "::error::El .aab no trae firma."
            exit 1
          fi

      - name: Sin clave de subida no hay .aab
        if: env.ANDROID_KEYSTORE_BASE64 == ''
        run: |
          echo "::warning::Sin ANDROID_KEYSTORE_BASE64 no se arma el .aab. Los APK sirven para probar, no para publicar en Google Play."

      - name: Cuánto pesa cada uno
        run: ls -lh entrega/

      - uses: actions/upload-artifact@v4
        with:
          name: studia-apk
          path: |
            entrega/*.apk
            entrega/*.aab
          if-no-files-found: error
          retention-days: 30

      # El artefacto de arriba se baja como .zip, y descomprimir en una tablet
      # es una molestia. La versión deja el .apk como descarga directa: se
      # toca el enlace y Android lo instala. La etiqueta es siempre la misma,
      # así que el enlace no cambia de una compilación a otra.
      - name: Publicarlo como descarga directa
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sufijo="${{ steps.nombre.outputs.sufijo }}"
          gh release delete ultimo-apk --yes --cleanup-tag 2>/dev/null || true
          gh release create ultimo-apk entrega/*.apk \
            --title "StudIA $sufijo" \
            --notes "Compilado desde \`${{ github.ref_name }}\` (${{ github.sha }}).

          **StudIA-$sufijo.apk** es el que sirve: trae solo arm64, que es lo que usa
          cualquier tablet o teléfono de los últimos años.

          **StudIA-liviano-$sufijo.apk** es el mismo, encogido con R8. Pesa bastante
          menos, pero no está probado: si no arranca, usa el de arriba.

          **StudIA-universal-$sufijo.apk** trae las cuatro arquitecturas y pesa el
          triple. Solo hace falta si el otro dice que no se puede instalar, cosa que
          pasa en aparatos viejos o en un Chromebook con procesador Intel.

          Se instala tocándolo y aceptando instalar desde esta fuente.

          Esta compilación es **${{ steps.nombre.outputs.modo }}**. Si el nombre del
          archivo termina en \`-demo\`, la app trae datos de ejemplo que viven en el
          teléfono: no hay cuentas, nada se guarda en un servidor y dos aparatos no
          ven lo mismo. Sirve para recorrer las pantallas, no para usarla de verdad.

          El nombre del archivo lleva la versión, el número de compilación y el commit,
          así que no se puede confundir con una descarga anterior. La app dice lo mismo
          adentro: sale abajo en la pantalla de perfil y en la de elegir perfil.

          Se instala encima de la anterior sin desinstalar nada: mismo paquete, misma
          firma y un número de compilación que sube en cada build." \
            --target "${{ github.sha }}"

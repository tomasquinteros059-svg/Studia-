# Construye un APK instalable sin depender de los servidores de Expo.
#
# El contenedor donde se desarrolla no puede salir a expo.dev, así que no hay
# EAS ni Expo Go. Acá el APK se arma con el SDK de Android que ya trae el
# runner: `expo prebuild` genera el proyecto nativo y Gradle lo compila. No
# hace falta cuenta de Expo, ni token, ni ningún secreto.
#
# Cómo usarlo: pestaña Actions → "APK para probar" → Run workflow. Al terminar,
# el APK queda colgado del run, en Artifacts.

name: APK para probar

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

# Para poder publicar la versión con el APK colgado.
permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json

      # React Native pide JDK 17.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar dependencias
        run: npm ci --prefix app

      # Que un APK roto no llegue nunca a la tablet.
      - name: Pruebas
        run: |
          npm run prueba
          npm run prueba:ui
          npm run tipos

      - name: Generar el proyecto Android
        working-directory: app
        run: npx expo prebuild --platform android --no-install
        env:
          EXPO_NO_TELEMETRY: "1"

      # `assembleRelease` empaqueta el JavaScript adentro del APK. Un build de
      # depuración no sirve: esperaría un servidor de desarrollo en la red y
      # fallaría al abrirlo, que es exactamente lo que hay que evitar.
      # Se compila dos veces a propósito. Por omisión el APK trae las cuatro
      # arquitecturas de Android en el mismo archivo, y las bibliotecas
      # nativas se llevan ahí la mayor parte de los 84 MB: un aparato usa una
      # sola y carga las otras tres de puro peso muerto. El primero trae solo
      # arm64, que es lo que usa cualquier tablet o teléfono de los últimos
      # años. El segundo las trae todas y queda como red de seguridad para un
      # aparato viejo o un Chromebook con procesador Intel.
      # Entre una compilación y otra hay que dejar el proyecto limpio, y
      # `gradlew clean` no sirve para eso: su tarea de C++ borra el código
      # generado de las dependencias y deja la caché de CMake apuntando a
      # carpetas que ya no existen. La segunda vez que se ejecuta, revienta
      # con "add_subdirectory given source ... which is not an existing
      # directory". Borrar las carpetas a mano no tiene ese problema: no
      # queda ninguna caché que pueda quedar desincronizada.
      - name: Preparar el limpiador entre compilaciones
        working-directory: app/android
        run: |
          cat > limpiar.sh <<'FIN'
          #!/usr/bin/env bash
          set -euo pipefail
          rm -rf app/build app/.cxx build
          # El código nativo que generan las dependencias se rehace solo en
          # la compilación siguiente; lo que no se rehace es la caché que lo
          # apunta, así que se va con lo demás.
          find ../node_modules -maxdepth 4 -type d -name .cxx -exec rm -rf {} + 2>/dev/null || true
          FIN
          chmod +x limpiar.sh

      - name: Compilar el APK para arm64
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a
          mkdir -p ../../entrega
          cp app/build/outputs/apk/release/*.apk ../../entrega/Acta.apk

      # Con R8: encoge el código Java, que es el segundo bulto del paquete
      # después de las bibliotecas nativas. Va aparte y no reemplaza al de
      # arriba porque R8 rompe código que usa reflexión, y desde el entorno de
      # desarrollo no hay forma de abrir el APK resultante para comprobarlo.
      # Si este falla al arrancar, el de arriba sigue estando.
      - name: Compilar el APK liviano
        working-directory: app/android
        run: |
          ./limpiar.sh
          ./gradlew assembleRelease --no-daemon \
            -PreactNativeArchitectures=arm64-v8a \
            -Pandroid.enableMinifyInReleaseBuilds=true \
            -Pandroid.enableShrinkResourcesInReleaseBuilds=true
          cp app/build/outputs/apk/release/*.apk ../../entrega/Acta-liviano.apk

      - name: Compilar el APK universal
        working-directory: app/android
        run: |
          ./limpiar.sh
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/*.apk ../../entrega/Acta-universal.apk

      - name: Cuánto pesa cada uno
        run: ls -lh entrega/

      - uses: actions/upload-artifact@v4
        with:
          name: acta-apk
          path: entrega/*.apk
          if-no-files-found: error
          retention-days: 30

      # El artefacto de arriba se baja como .zip, y descomprimir en una tablet
      # es una molestia. La versión deja el .apk como descarga directa: se
      # toca el enlace y Android lo instala. La etiqueta es siempre la misma,
      # así que el enlace no cambia de una compilación a otra.
      - name: Publicarlo como descarga directa
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete ultimo-apk --yes --cleanup-tag 2>/dev/null || true
          gh release create ultimo-apk entrega/Acta.apk entrega/Acta-liviano.apk entrega/Acta-universal.apk \
            --title "Acta · último APK" \
            --notes "Compilado desde \`${{ github.ref_name }}\` (${{ github.sha }}).

          ### Cuál bajar

          **Acta-liviano.apk** — empieza por este. Es el más chico, y en un teléfono esa
          diferencia es la que hace que la descarga termine en vez de quedarse pegada.

          **Acta.apk** — el mismo sin encoger, por si el de arriba no arranca.

          **Acta-universal.apk** — solo si los otros dicen que no se pueden instalar.
          Pesa el triple; hace falta en aparatos viejos o en un Chromebook con
          procesador Intel.

          Se instala tocándolo y aceptando instalar desde esta fuente. Trae reuniones de
          ejemplo, así que funciona sin servidor y sin cuenta." \
            --target "${{ github.sha }}"

# Publica el demo de StudIA en una dirección que abra cualquiera.
#
#   https://tomasquinteros059-svg.github.io/Studia-/
#
# Para qué: enseñarle StudIA a alguien que no va a instalar nada. Se manda el
# enlace y se abre en el teléfono de quien sea, sin cuenta y sin descargar.
#
# Lo que se publica es SOLO la carpeta `demo/`: la aplicación ya compilada, en
# un archivo. El resto del repositorio no se sirve.
#
# Va con `noindex` y con robots.txt: se llega por enlace, no por buscador. La
# aplicación todavía no está publicada, y una página encontrada suelta —sin
# nadie que la explique— se lee como un producto que ya existe.

name: Publicar el demo

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    # Solo cuando cambia el demo. Sin esto, cada cambio del código fuente
    # dispararía una publicación que no publica nada distinto.
    paths: ["demo/**", ".github/workflows/pages.yml"]

# Lo que necesita `deploy-pages` para dejar el sitio arriba.
permissions:
  contents: read
  pages: write
  id-token: write

# Una publicación a la vez. Dos corriendo juntas dejan arriba la que termina
# última, que no siempre es la más nueva.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    environment:
      name: github-pages
      url: ${{ steps.publicado.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      # Sin `enablement: true`, y no por gusto: se probó y falla con «Resource
      # not accessible by integration». Crear el sitio de Páginas pide permiso
      # de administración del repositorio, y el token de Actions no lo tiene ni
      # se lo puede conceder el bloque `permissions` de arriba. Encenderlo es
      # cosa de una persona, una sola vez.
      - name: Preparar la publicación
        id: preparar
        continue-on-error: true
        uses: actions/configure-pages@v5

      # Si Páginas está apagado, el paso de arriba falla y los de abajo se
      # caerían con un error del API que no le dice nada a nadie. Mejor decir
      # qué hay que tocar, que son tres toques y se hacen desde el teléfono.
      - name: Si Páginas está apagado, decirlo
        if: steps.preparar.outcome == 'failure'
        run: |
          {
            echo "## Falta encender Páginas, una sola vez"
            echo
            echo "En este repositorio: **Settings → Pages → Build and deployment**,"
            echo "y en **Source** elegir **GitHub Actions**. Se guarda solo."
            echo
            echo "Después, **Actions → Publicar el demo → Run workflow**, y el"
            echo "demo queda en:"
            echo
            echo '**https://tomasquinteros059-svg.github.io/Studia-/**'
            echo
            echo "Encenderlo pide permiso de administración del repositorio, y el"
            echo "token de Actions no lo tiene: por eso no se puede automatizar."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::Páginas está apagado. Settings → Pages → Source: GitHub Actions."
          exit 1

      - name: Empaquetar la carpeta del demo
        uses: actions/upload-pages-artifact@v3
        with:
          path: demo

      - name: Dejarlo arriba
        id: publicado
        uses: actions/deploy-pages@v4

      - name: Decir dónde quedó
        run: |
          {
            echo "## El demo está publicado"
            echo
            echo "**${{ steps.publicado.outputs.page_url }}**"
            echo
            echo "Se abre en cualquier navegador, sin cuenta y sin instalar nada."
            echo "Lleva \`noindex\`: funciona por enlace, no aparece en buscadores."
          } >> "$GITHUB_STEP_SUMMARY"

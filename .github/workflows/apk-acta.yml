# El APK de Acta, la aplicación de reuniones, para tenerla instalada al lado
# de StudIA sin que una reemplace a la otra.
#
# Acta y StudIA son la misma aplicación en dos momentos distintos de su
# historia: Acta vive en el commit ACTA de más abajo, antes de que el
# proyecto volviera a ser StudIA. Este flujo la saca de ahí tal como quedó y
# la compila, sin tocar nada de lo que hay hoy en la rama.
#
# Lo único que se le cambia es el identificador del paquete. Android decide
# por él si dos archivos son la misma aplicación: con el mismo identificador,
# instalar Acta significaría desinstalar StudIA y quedarse sin sus datos.
# Con uno propio, quedan las dos en el teléfono, cada una con lo suyo.
#
# Se publica en su propia versión de GitHub —`acta-apk`— para que la de
# StudIA, que es la que se usa a diario, no se vea tocada.

name: APK de Acta (reuniones)

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  # El último commit de Acta, justo antes de "Volver a StudIA".
  ACTA: 7b2f0484703771f8c852d841a3089047c5a3e044

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # A propósito no es el commit de la rama: se compila la app tal como
      # quedó, no la de hoy. El archivo de este flujo ya está cargado, así
      # que traer otro árbol de trabajo no lo afecta.
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.ACTA }}

      # Lo que se le agrega a Acta vive en `acta/` de la rama de hoy, no en
      # su commit. Se trae aparte para no pisar el árbol recién sacado.
      - name: Traer los parches de la rama
        uses: actions/checkout@v4
        with:
          sparse-checkout: acta
          sparse-checkout-cone-mode: false
          path: .parches

      - name: Aplicarlos
        run: |
          shopt -s nullglob
          parches=(.parches/acta/*.patch)
          if [ ${#parches[@]} -eq 0 ]; then
            echo "No hay parches que aplicar."
            exit 0
          fi
          for p in "${parches[@]}"; do
            echo "→ $p"
            # --check primero: un parche que no calza tiene que detener la
            # compilación acá, no dejar el árbol a medio aplicar.
            git apply --check "$p"
            git apply "$p"
          done
          rm -rf .parches

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar dependencias
        run: npm ci --prefix app

      - name: Pruebas
        run: |
          npm run prueba
          npm run prueba:ui
          npm run tipos

      # Lo único que se toca del proyecto. Sin esto las dos aplicaciones se
      # pisan: Android las trata como la misma y la segunda reemplaza a la
      # primera, datos incluidos.
      - name: Darle identificador propio, para que no reemplace a StudIA
        id: nombre
        run: |
          node -e '
            const fs = require("fs");
            const ruta = "app/app.json";
            const config = JSON.parse(fs.readFileSync(ruta, "utf8"));
            config.expo.android.package = "cl.acta.app";
            config.expo.ios.bundleIdentifier = "cl.acta.app";
            config.expo.android.versionCode = 1;
            config.expo.version = "1.0.0";
            fs.writeFileSync(ruta, JSON.stringify(config, null, 2) + "\n");
          '
          node -e '
            const c = require("./app/app.json").expo;
            if (c.android.package === "cl.studia.app") throw new Error("sigue pisando a StudIA");
            console.log(`${c.name} ${c.version} · ${c.android.package}`);
          '
          echo "sufijo=1.0.0-${ACTA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Generar el proyecto Android
        working-directory: app
        run: npx expo prebuild --platform android --no-install
        env:
          EXPO_NO_TELEMETRY: "1"

      # `gradlew clean` no sirve entre una compilación y otra: borra el código
      # generado de las dependencias y deja la caché de CMake apuntando a
      # carpetas que ya no están. Se borra a mano.
      - name: Preparar el limpiador entre compilaciones
        working-directory: app/android
        run: |
          cat > limpiar.sh <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          rm -rf app/build app/.cxx build
          find ../node_modules -maxdepth 4 -type d -name .cxx -exec rm -rf {} + 2>/dev/null || true
          SH
          chmod +x limpiar.sh

      - name: Compilar el APK para arm64
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a
          mkdir -p ../../entrega
          cp app/build/outputs/apk/release/*.apk "../../entrega/Acta-${{ steps.nombre.outputs.sufijo }}.apk"

      - name: Compilar el APK universal
        working-directory: app/android
        run: |
          ./limpiar.sh
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/*.apk "../../entrega/Acta-universal-${{ steps.nombre.outputs.sufijo }}.apk"

      - name: Cuánto pesa cada uno
        run: ls -lh entrega/

      - uses: actions/upload-artifact@v4
        with:
          name: acta-apk
          path: entrega/*.apk
          if-no-files-found: error
          retention-days: 30

      # En su propia versión, con su propia etiqueta: la de StudIA no se toca.
      - name: Publicarlo como descarga directa
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sufijo="${{ steps.nombre.outputs.sufijo }}"
          gh release delete acta-apk --yes --cleanup-tag 2>/dev/null || true
          gh release create acta-apk entrega/*.apk \
            --title "Acta $sufijo · reuniones" \
            --notes "La aplicación de reuniones, compilada desde el commit \`$ACTA\`.

          Se instala **al lado de StudIA**, no encima: lleva su propio
          identificador de paquete (\`cl.acta.app\`), así que quedan las dos en el
          teléfono, con su propio ícono y sus propios datos.

          **Acta-$sufijo.apk** es el que sirve: solo arm64, que es lo que usa
          cualquier tablet o teléfono de los últimos años.

          **Acta-universal-$sufijo.apk** trae las cuatro arquitecturas y pesa el
          triple. Solo hace falta si el otro dice que no se puede instalar.

          Trae datos de ejemplo, así que funciona sin servidor. El micrófono no
          se enciende solo: a la hora agendada llega un aviso y se empieza a
          grabar con un toque." \
            --target "$ACTA"
